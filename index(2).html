<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة رشّح | قاعدة بيانات الكفاءات والسير الذاتية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center font-black text-xl text-slate-900">ر</div>
                <div>
                    <span class="text-xl font-black text-white">رَشّـــح</span>
                    <span class="text-xs text-emerald-400 block font-semibold">منصة الكفاءات الذكية</span>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 text-xs">
                    <span class="text-slate-400">رصيدك:</span> <span class="font-bold text-emerald-400">5 نقاط</span>
                </div>
                <button onclick="alert('لشحن رصيد باقتك تواصل معنا')" class="bg-emerald-500 text-slate-900 font-bold px-3 py-1.5 rounded-lg text-xs">+ شحن</button>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <div class="text-center max-w-2xl mx-auto mb-8">
            <h1 class="text-3xl font-black text-slate-900 mb-2">استقطب كفاءاتك في ثوانٍ</h1>
            <p class="text-slate-600 text-sm">ابحث بالاسم، المسمى الوظيفي، أو المهارات وتواصل مع الكفاءات المعتمدة.</p>
        </div>

        <!-- Search Box -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-8">
            <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
                <div class="sm:col-span-6">
                    <input type="text" id="keyword" oninput="filterCandidates()" placeholder="🔍 ابحث بالمهارة أو الوظيفة (مثال: محاسب، مهندس، مبيعات...)" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                </div>
                <div class="sm:col-span-4">
                    <select id="city" onchange="filterCandidates()" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-emerald-500">
                        <option value="">كافة المدن (الرياض، جدة، الدمام...)</option>
                        <option value="الرياض">الرياض</option>
                        <option value="جدة">جدة</option>
                        <option value="الدمام">الدمام</option>
                        <option value="مكة">مكة المكرمة</option>
                        <option value="المدينة">المدينة المنورة</option>
                        <option value="الخبر">الخبر</option>
                    </select>
                </div>
                <div class="sm:col-span-2">
                    <button onclick="filterCandidates()" class="w-full bg-slate-900 text-white font-bold py-2.5 rounded-xl text-sm hover:bg-slate-800">تصفية</button>
                </div>
            </div>
        </div>

        <!-- Cards Grid -->
        <div id="candidates-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        منصة رشّح لاستقطاب الكفاءات والسير الذاتية © 2026
    </footer>

    <script>
        const candidates = [
            { id: 1, full_name: "م. سعد بن خالد العتيبي", job_title: "مدير مشاريع تقنية (PMP)", exp: 8, city: "الرياض", skills: "Scrum, Agile, JIRA, Python, IT Management" },
            { id: 2, full_name: "أ. سارة إبراهيم الشمري", job_title: "أخصائية استقطاب مواهب و HR", exp: 5, city: "جدة", skills: "Talent Acquisition, CIPD, HR Policies, Payroll" },
            { id: 3, full_name: "م. عبدالله فهد الدوسري", job_title: "مهندس برمجيات أول Full-Stack", exp: 6, city: "الدمام", skills: "React, Node.js, FastAPI, PostgreSQL, AWS" },
            { id: 4, full_name: "أ. مها ناصر القحطاني", job_title: "مديرة تسويق رقمي ونمو", exp: 4, city: "الرياض", skills: "SEO, Google Ads, Meta Ads, Growth Hacking" },
            { id: 5, full_name: "أ. محمد طارق الزهراني", job_title: "محلل مالي ونمذجة مالية", exp: 7, city: "الرياض", skills: "Financial Modeling, Power BI, Excel, CMA" },
            { id: 6, full_name: "م. فيصل مساعد الغامدي", job_title: "مهندس أمن سيبراني SOC", exp: 5, city: "الرياض", skills: "SIEM, SOC, Network Security, CEH, ISO 27001" },
            { id: 7, full_name: "أ. ريم سليمان الحربي", job_title: "مديرة مبيعات وتطوير أعمال", exp: 6, city: "جدة", skills: "B2B Sales, CRM, Negotiation, Key Accounts" },
            { id: 8, full_name: "م. عمر خالد السبيعي", job_title: "مهندس ذكاء اصطناعي وتحليل بيانات", exp: 4, city: "الرياض", skills: "Machine Learning, PyTorch, LangChain, Pandas" },
            { id: 9, full_name: "أ. نورة عبدالعزيز الشهري", job_title: "مصممة تجربة مستخدم UI/UX", exp: 5, city: "الدمام", skills: "Figma, User Research, Wireframing, Prototyping" }
        ];

        function render(list) {
            const grid = document.getElementById('candidates-grid');
            if(list.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 bg-white rounded-2xl border text-slate-500">⚠️ لا توجد نتائج مطابقة</div>';
                return;
            }
            grid.innerHTML = list.map(c => `
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition-all flex flex-col justify-between">
                    <div>
                        <div class="flex items-start justify-between mb-2">
                            <h3 class="font-bold text-slate-900 text-base">${c.full_name}</h3>
                            <span class="bg-emerald-50 text-emerald-700 text-[11px] font-bold px-2 py-0.5 rounded-full border border-emerald-200">✓ موثق</span>
                        </div>
                        <div class="text-emerald-600 font-bold text-xs mb-3">${c.job_title}</div>
                        <div class="flex items-center gap-3 text-xs text-slate-500 mb-3 bg-slate-50 p-2.5 rounded-xl">
                            <span>📍 ${c.city}</span><span>•</span><span>⏳ خبرة: ${c.exp} سنوات</span>
                        </div>
                        <div class="text-xs text-slate-600 mb-5">
                            <span class="font-bold text-slate-700">المهارات:</span> ${c.skills}
                        </div>
                    </div>
                    <button onclick="alert('تم إرسال طلب فتح السيرة الذاتية للمرشح #${c.id}')" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-2.5 rounded-xl text-xs transition-all">
                        🔓 فتح السيرة الذاتية (1 نقطة)
                    </button>
                </div>
            `).join('');
        }

        function filterCandidates() {
            const kw = document.getElementById('keyword').value.toLowerCase().trim();
            const city = document.getElementById('city').value.trim();
            const filtered = candidates.filter(c => {
                const matchKw = !kw || c.job_title.toLowerCase().includes(kw) || c.skills.toLowerCase().includes(kw) || c.full_name.toLowerCase().includes(kw);
                const matchCity = !city || c.city.includes(city);
                return matchKw && matchCity;
            });
            render(filtered);
        }

        render(candidates);
    </script>
</body>
</html>
