<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رَشّـــح | RASHEH TALENT - بوابة استقطاب الكفاءات الذكية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b1120; color: #f8fafc; }
        .gold-gradient { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); }
        .gold-text { color: #fbbf24; }
        .gold-border { border-color: #f59e0b; }
        .card-dark { background-color: #111827; border: 1px solid #1f2937; }
        .input-dark { background-color: #0f172a; border: 1px solid #1e293b; color: #fff; }
        .input-dark:focus { border-color: #f59e0b; outline: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Auth View (Login / Register Modal Screen) -->
    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0b1120] bg-opacity-95 backdrop-blur-md">
        <div class="bg-[#111827] border border-slate-800 rounded-3xl max-w-md w-full p-8 shadow-2xl relative">
            <!-- Brand Header -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-gradient-to-tr from-amber-500 to-amber-300 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-amber-500/20 text-slate-950 font-black text-2xl">
                    رَشّـحْ
                </div>
                <h1 class="text-2xl font-black text-amber-400 tracking-wider">رَشّـــحْ</h1>
                <span class="text-xs text-amber-400/80 font-bold tracking-widest block uppercase mt-1">RASHEH TALENT</span>
                <p class="text-xs text-slate-400 mt-2 font-medium">بوابة الشركات الأولى لترشيح الكفاءات الذكية</p>
            </div>

            <!-- Tab Switcher -->
            <div class="grid grid-cols-2 bg-[#0b1120] p-1.5 rounded-2xl mb-6 border border-slate-800">
                <button onclick="setAuthTab('login')" id="tab-btn-login" class="py-2.5 text-xs font-bold rounded-xl gold-gradient text-slate-950 shadow-md transition-all">
                    تسجيل الدخول
                </button>
                <button onclick="setAuthTab('register')" id="tab-btn-register" class="py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition-all">
                    حساب جديد (2+ CV)
                </button>
            </div>

            <!-- Login Form -->
            <form id="form-login" onsubmit="handleAuth(event, 'login')">
                <div class="space-y-4 mb-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">البريد الإلكتروني للشركة *</label>
                        <input type="email" id="login-email" value="mohamedsaamiir0@gmail.com" required class="w-full input-dark rounded-xl px-4 py-3 text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">كلمة المرور *</label>
                        <input type="password" id="login-password" value="12345678" required class="w-full input-dark rounded-xl px-4 py-3 text-xs">
                    </div>
                </div>
                <button type="submit" class="w-full gold-gradient text-slate-950 font-black py-3 rounded-xl text-xs shadow-lg shadow-amber-500/20 hover:brightness-110 transition-all">
                    دخول إلى المنصة ←
                </button>
            </form>

            <!-- Register Form (Hidden by default) -->
            <form id="form-register" class="hidden" onsubmit="handleAuth(event, 'register')">
                <div class="space-y-4 mb-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">اسم الشركة / المؤسسة *</label>
                        <input type="text" id="reg-company" placeholder="شركة الأفق للتطوير" required class="w-full input-dark rounded-xl px-4 py-3 text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">البريد الإلكتروني المهني *</label>
                        <input type="email" id="reg-email" placeholder="hr@company.com" required class="w-full input-dark rounded-xl px-4 py-3 text-xs">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">كلمة المرور *</label>
                        <input type="password" id="reg-password" placeholder="••••••••" required class="w-full input-dark rounded-xl px-4 py-3 text-xs">
                    </div>
                </div>
                <button type="submit" class="w-full gold-gradient text-slate-950 font-black py-3 rounded-xl text-xs shadow-lg shadow-amber-500/20 hover:brightness-110 transition-all">
                    إنشاء حساب واستلام 2 CV مجاناً ←
                </button>
            </form>
        </div>
    </div>

    <!-- Main Platform View (Shown after login) -->
    <div id="main-platform" class="flex flex-col min-h-screen">
        <!-- Header -->
        <header class="bg-[#111827] border-b border-slate-800 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 gold-gradient text-slate-950 font-black rounded-xl flex items-center justify-center text-xl shadow-md">
                        رَ
                    </div>
                    <div>
                        <span class="text-lg font-black text-amber-400">رَشّـــحْ</span>
                        <span class="text-[10px] text-slate-400 block font-bold">RASHEH TALENT</span>
                    </div>
                </div>

                <!-- Navigation Tabs -->
                <nav class="hidden md:flex items-center gap-1 bg-[#0b1120] p-1.5 rounded-xl border border-slate-800">
                    <button onclick="switchTab('explore')" id="nav-explore" class="px-4 py-1.5 text-xs font-bold rounded-lg gold-gradient text-slate-950 shadow-sm transition-all">
                        استكشاف الكفاءات
                    </button>
                    <button onclick="switchTab('pricing')" id="nav-pricing" class="px-4 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all">
                        الباقات والأسعار
                    </button>
                    <button onclick="switchTab('admin')" id="nav-admin" class="px-4 py-1.5 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition-all">
                        لوحة التحكم
                    </button>
                </nav>

                <!-- Balance & Actions -->
                <div class="flex items-center gap-3">
                    <div class="bg-[#0b1120] border border-slate-800 px-3.5 py-1.5 rounded-xl flex items-center gap-2">
                        <span class="text-[11px] text-slate-400">الرصيد:</span>
                        <span id="user-points" class="text-xs font-black text-amber-400">5 سير ذاتية</span>
                    </div>
                    <button onclick="switchTab('pricing')" class="gold-gradient text-slate-950 font-black px-3.5 py-1.5 rounded-xl text-xs transition-all shadow-md">
                        + شحن الرصيد
                    </button>
                </div>
            </div>
        </header>

        <!-- Body Content -->
        <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
            
            <!-- SECTION 1: Explore Candidates -->
            <section id="tab-explore">
                <div class="text-center max-w-2xl mx-auto mb-8">
                    <span class="bg-amber-500/10 text-amber-400 text-[11px] font-bold px-3 py-1 rounded-full uppercase mb-2 inline-block border border-amber-500/20">قاعدة كفاءات المملكة المعتمدة</span>
                    <h2 class="text-2xl sm:text-3xl font-black text-white mb-2">استقطب كفاءاتك في ثوانٍ معدودة</h2>
                    <p class="text-slate-400 text-xs">مطابقة ذكية بالوظائف والمهارات مع فتح فوري للسير الذاتية.</p>
                </div>

                <!-- Search & Filters -->
                <div class="card-dark rounded-2xl p-4 sm:p-5 mb-8 border border-slate-800 shadow-xl">
                    <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
                        <div class="sm:col-span-6">
                            <input type="text" id="keyword" oninput="filterCandidates()" placeholder="🔍 ابحث بالمسمى الوظيفي أو المهارة (محاسب، مهندس، مبيعات...)" class="w-full input-dark rounded-xl px-4 py-2.5 text-xs">
                        </div>
                        <div class="sm:col-span-3">
                            <select id="city" onchange="filterCandidates()" class="w-full input-dark rounded-xl px-3 py-2.5 text-xs">
                                <option value="">كافة المدن (الرياض، جدة، الدمام...)</option>
                                <option value="الرياض">الرياض</option>
                                <option value="جدة">جدة</option>
                                <option value="الدمام">الدمام</option>
                                <option value="مكة">مكة المكرمة</option>
                                <option value="المدينة">المدينة المنورة</option>
                                <option value="الخبر">الخبر</option>
                            </select>
                        </div>
                        <div class="sm:col-span-3">
                            <select id="min-exp" onchange="filterCandidates()" class="w-full input-dark rounded-xl px-3 py-2.5 text-xs">
                                <option value="0">كافة سنوات الخبرة</option>
                                <option value="3">3 سنوات فما فوق</option>
                                <option value="5">5 سنوات فما فوق</option>
